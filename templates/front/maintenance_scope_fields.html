<div class="form-group {% if form.scope.errors %}has-error{% endif %}">
    <span id="{{ p }}-scope-label" class="col-sm-3 control-label">Scope</span>
    <div class="col-sm-9" role="radiogroup" aria-labelledby="{{ p }}-scope-label">
        <label class="radio-container">
            <input type="radio" name="scope" value="all" {% if form.scope.value != "tags" %}checked{% endif %} {% if form.scope.errors %}aria-invalid="true"{% endif %}>
            <span class="radiomark"></span>
            All checks
        </label>
        <label class="radio-container">
            <input type="radio" name="scope" value="tags" {% if form.scope.value == "tags" %}checked{% endif %} {% if form.scope.errors %}aria-invalid="true"{% endif %}>
            <span class="radiomark"></span>
            Checks with all of these tags
        </label>
        {% if form.scope.errors %}
        <div class="help-block">{{ form.scope.errors|join:" " }}</div>
        {% endif %}
    </div>
</div>

<div class="form-group mw-tags-group {% if form.tags.errors %}has-error{% endif %}">
    <label for="{{ p }}-tags" class="col-sm-3 control-label">Tags</label>
    <div class="col-sm-9">
        <input
            id="{{ p }}-tags"
            name="tags"
            type="text"
            maxlength="500"
            class="mw-tags"
            value="{{ form.tags.value|default:'' }}"
            aria-describedby="{{ p }}-tags-help"
            {% if form.tags.errors %}aria-invalid="true"{% endif %}>
        {% if form.tags.errors %}
        <div id="{{ p }}-tags-help" class="help-block">{{ form.tags.errors|join:" " }}</div>
        {% else %}
        <span id="{{ p }}-tags-help" class="help-block">Separate tags with spaces. A check must have every tag to be covered.</span>
        {% endif %}
    </div>
</div>

<div class="form-group">
    <div class="col-sm-9 col-sm-offset-3">
        <div class="maintenance-preview" aria-live="polite"></div>
    </div>
</div>
